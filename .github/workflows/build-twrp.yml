name: Build TWRP for X6532C

on:
  workflow_dispatch:
    inputs:
      twrp_branch:
        description: "TWRP manifest branch"
        required: true
        default: "twrp-12.1"
        type: choice
        options: ["twrp-12.1", "twrp-11"]
  push:
    tags: ["v*"]

concurrency:
  group: twrp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/share/swift \
                      /usr/local/.ghcup /opt/microsoft /usr/lib/firefox
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop patch pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk python3 \
            python-is-python3
          mkdir -p "$HOME/bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          java -version

      - name: Configure git and swap
        run: |
          git config --global user.name "gh-actions"
          git config --global user.email "gh-actions@users.noreply.github.com"
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 8G /swapfile-extra
            sudo chmod 600 /swapfile-extra
            sudo mkswap /swapfile-extra && sudo swapon /swapfile-extra
          fi
          swapon --show || true
          free -h

      - name: Sync TWRP sources
        run: |
          set -e
          mkdir -p twrp
          cd twrp
          BRANCH="${{ inputs.twrp_branch || 'twrp-12.1' }}"
          for attempt in 1 2 3; do
            echo "=== repo init attempt $attempt ($BRANCH) ==="
            rm -rf .repo/local_manifests
            if repo init --depth=1 \
                 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
                 -b "$BRANCH"; then
              break
            fi
            echo "repo init failed, retrying in 30s"
            sleep 30
          done
          for attempt in 1 2 3; do
            echo "=== repo sync attempt $attempt ==="
            if repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags; then
              break
            fi
            echo "sync failed, retrying in 60s"
            sleep 60
          done
          test -f bootable/recovery/variables.h
          grep -E 'TW_MAIN_VERSION_STR' bootable/recovery/variables.h
          df -h /

      - name: Install device tree
        run: |
          mkdir -p twrp/device/infinix
          cp -a device/infinix/X6532C twrp/device/infinix/
          test -f twrp/device/infinix/X6532C/BoardConfig.mk
          ls twrp/device/infinix/X6532C/prebuilt/

      - name: Build vendor_boot (recovery)
        run: |
          # GitHub runs this with bash -eo pipefail; envsetup.sh returns non-zero
          # at the end of sourcing, which would kill the step before lunch ever runs.
          set +e
          set -o pipefail
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh
          echo "envsetup rc=$?"

          lunch twrp_X6532C-eng
          rc=$?
          echo "lunch rc=$rc TARGET_PRODUCT=$TARGET_PRODUCT TARGET_DEVICE=$TARGET_DEVICE"
          if [ $rc -ne 0 ] || [ -z "$TARGET_PRODUCT" ]; then
            echo "=== available combos ==="
            print_lunch_menu
            exit 1
          fi

          mka adbd vendorbootimage -j"$(nproc)" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "mka rc=$rc"
          exit $rc

      - name: Collect and validate
        if: success()
        run: |
          OUT=twrp/out/target/product/X6532C
          mkdir -p artifacts
          for f in vendor_boot.img recovery.img boot.img; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" artifacts/ || true
          done
          cp twrp/build.log artifacts/build.log || true

          test -s artifacts/vendor_boot.img || { echo "FAIL no vendor_boot.img"; exit 1; }

          python3 - <<'PY'
          import glob, hashlib, os, struct
          lines = []
          for path in sorted(glob.glob("artifacts/*.img")):
              data = open(path, "rb").read()
              magic = data[:8].decode("ascii", "replace")
              size = len(data)
              limit = 67108864 if "vendor_boot" in path else None
              lines.append(f"{os.path.basename(path)}: magic={magic!r} size={size}")
              if limit and size > limit:
                  raise SystemExit(f"FAIL {path} exceeds partition size {limit}")
              if "vendor_boot" in path and magic != "VNDRBOOT":
                  raise SystemExit(f"FAIL {path} is not a vendor_boot image")
          if not lines:
              raise SystemExit("FAIL no image produced")
          sha = []
          for path in sorted(glob.glob("artifacts/*")):
              h = hashlib.sha256(open(path, "rb").read()).hexdigest()
              sha.append(f"{h}  {os.path.basename(path)}")
          open("artifacts/SHA256SUMS", "w").write("\n".join(sha) + "\n")
          info = "\n".join(lines) + "\n\n" + "\n".join(sha) + "\n"
          open("artifacts/build-info.txt", "w").write(info)
          print(info)
          PY

      - name: Verify ramdisk contents
        if: success()
        run: |
          set -e
          python3 - <<'PY'
          import struct
          d = open("artifacts/vendor_boot.img", "rb").read()
          assert d[:8] == b"VNDRBOOT"
          header_version, page_size = struct.unpack_from("<II", d, 8)
          ramdisk_size = struct.unpack_from("<I", d, 0x18)[0]
          open("vb_ramdisk.lz4", "wb").write(d[page_size:page_size + ramdisk_size])
          print(f"header_version={header_version} page_size={page_size} ramdisk={ramdisk_size}")
          PY
          lz4 -d -c vb_ramdisk.lz4 > vb.cpio
          cpio -it --quiet < vb.cpio > vb.list
          echo "ramdisk entries: $(wc -l < vb.list)"

          missing=0
          for f in \
              vendor/etc/vintf/manifest.xml \
              system/etc/vintf/manifest.xml \
              init.decrypt.rc \
              init.recovery.mt6765.rc \
              system/bin/recovery \
              system/bin/hwservicemanager \
              system/etc/recovery.fstab \
              system/etc/twrp.flags \
              first_stage_ramdisk/fstab.mt6765 \
              vendor/bin/hw/android.hardware.keymaster@4.1-service.trustonic \
              vendor/bin/hw/android.hardware.gatekeeper@1.0-service \
              vendor/bin/mcDriverDaemon; do
            if grep -qx "$f" vb.list; then
              echo "  ok   $f"
            else
              echo "  MISS $f"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || { echo "FAIL ramdisk is missing required files"; exit 1; }

          cpio -i --to-stdout --quiet prop.default < vb.cpio > prop.default
          grep -E '^(keymaster_ver|ro.hardware.gatekeeper|ro.crypto.volume.filenames_mode)=' prop.default
          grep -qx 'keymaster_ver=4.1' prop.default || { echo "FAIL keymaster_ver=4.1 missing"; exit 1; }
          echo "PASS ramdisk validation"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-X6532C-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: twrp/build.log
          if-no-files-found: ignore
